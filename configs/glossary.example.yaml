# Translation glossary (copy to configs/glossary.yaml, or run `vndub translate --seed-glossary`).
# Sent to the LLM in the system prompt; character entries and terms are injected only
# when they occur in the batch (GalTransl-style "GPT dictionary").

target_lang: ru

# How Japanese honorifics are rendered: drop | transliterate | map
honorifics: drop
honorific_map:
  さん: ""
  ちゃん: ""
  くん: ""
  様: ""
  先輩: "семпай"
  先生: "сэнсэй"

# ты / вы between characters: speaker -> listener -> form ("default" for anyone else)
address_matrix:
  sakura: {default: ты}
  haruto: {default: ты}
  yui: {default: ты, teacher: вы}

characters:
  sakura:
    src: さくら
    tgt: Сакура
    gender: f              # drives past-tense / adjective agreement in Russian
    age_hint: teen
    notes: "energetic, cheerful classmate"
  haruto:
    src: 陽翔
    tgt: Харуто
    gender: m
    age_hint: teen
    notes: "calm, a little dry"
  yui:
    src: ゆい
    tgt: Юи
    gender: f
    age_hint: teen
    notes: "shy, quiet"

# The player: the protagonist the characters address as "you" (darling, dear ...). Its gender decides grammatical agreement of the words said
# to or about the player (ru: "ty vernulsya, dorogoi" for m, "ty vernulas, dorogaya" for f). m | f | unknown (unknown: wordings that do not reveal it,
# the masculine when impossible). Narration and the protagonist's own lines take this gender too; speaker_id names the protagonist's
# speaker (optional: a speaker whose name in the script is an interpolation, Character("[player_name]"), counts without it).
player:
  name: ""
  gender: unknown
  notes: ""
  speaker_id: ""

# Proper nouns the model should spell one way. The names pass (translate.names_pass) adds the ones it finds with notes "auto" (kept in
# work/glossary_auto.yaml; the app lists them as found automatically, and one deleted there is not added again); a term written here wins.
# Terms match whole words, case-insensitive ("Ann" is not in "Annoying"); Japanese terms match anywhere.
terms:
  - {src: 放課後, tgt: после уроков}
  - {src: 校門, tgt: школьные ворота}

style_rules:
  - "Keep the register and the emotional tone of the original line."
  - "Interjections must sound natural in Russian (えっ -> «а?», うん -> «угу»), not literal."
  - "Do not add explanations or notes into the translated text."

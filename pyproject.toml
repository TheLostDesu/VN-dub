[project]
name = "vndub"
version = "1.0.3"
description = "Fully local visual-novel dubbing pipeline: game assets -> who said what -> expression passport -> expressive TTS/VC in the same voice -> patch."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "vndub contributors" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "orjson>=3.9",
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "rapidfuzz>=3.6",
    "pyloudnorm>=0.1.1",
    "tqdm>=4.66",
    "rich>=13.7",
    "gradio>=4.44",
    "jinja2>=3.1",
    "sqlite-utils>=3.36",
    "jiwer>=3.0",
    "fastdtw>=0.3.4",
    "num2words>=0.5.13",
    "huggingface-hub>=0.24",
    "openpyxl>=3.1",
    # desktop app layer (vndub_app): API server, window shell
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",  # uvicorn's WebSocket implementation (/api/progress)
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pywebview>=5.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Extraction helpers that are pure pip packages (wrapped as subprocesses / imports when present).
extract = ["unrpa>=2.3", "UnityPy>=1.20"]

[project.scripts]
vndub = "vndub.cli:main"
vndub-app = "vndub_app.shell:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "playwright>=1.45", "pyinstaller>=6.6"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vndub", "vndub_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 300
markers = [
    "slow: end-to-end or model-backed tests",
    "e2e: Playwright walk of the desktop app wizard (needs the built SPA + Chromium)",
    "network: talks to the real huggingface.co (small downloads); skipped unless VNDUB_NETWORK_TESTS=1",
]
